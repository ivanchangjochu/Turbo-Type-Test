<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>測出你的核心價值屬性｜州巧科技</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FDFBF7;
    --surface: #FFFFFF;
    --ink: #0B2A55;
    --ink-soft: #5A6C85;
    --line: #E3E1D8;

    /* CIS 品牌色 */
    --navy: #05388B;
    --blue: #3F66A9;
    --teal: #268589;
    --mint: #8BCDC9;
    --gold: #F6A724;
    --orange: #DA641A;

    --brand: var(--navy);
    --brand-deep: #042A6B;
    --brand-pale: #E7ECF6;

    /* 三型代表色：全部取自 CIS 標誌實際色票，不額外編色
       熱情=CIS橘紅、創新=CIS深藍、共贏=CIS青綠（CIS標誌裡最接近綠色調的顏色） */
    --passion: var(--orange);
    --passion-pale: #FBE4D6;
    --innovation: var(--navy);
    --innovation-pale: #DEE6F2;
    --winwin: var(--teal);
    --winwin-pale: #DCEEEF;

    /* 過年裝飾色：僅用於背景裝飾（燈籠、角花、紙片），不影響上面三型的識別色 */
    --festive-red: #C23B22;
    --festive-red-deep: #9A2C18;

    --radius: 20px;
    --shadow: 0 20px 50px -25px rgba(11,42,85,0.35);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "Noto Sans", "PingFang TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height: 100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 48px 20px 80px;
    position: relative;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 10% -8%, rgba(5,56,139,0.06), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(246,167,36,0.18), transparent 42%),
      radial-gradient(circle at 85% 90%, rgba(194,59,34,0.12), transparent 45%),
      radial-gradient(circle at 5% 95%, rgba(194,59,34,0.16), transparent 45%),
      var(--bg);
  }

  .stage{
    width:100%;
    max-width: 640px;
  }

  .eyebrow{
    display:flex;
    align-items:center;
    gap:10px;
    font-family: "IBM Plex Mono", "Noto Sans", sans-serif;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .eyebrow::before{
    content:"";
    width: 20px; height: 1px;
    background: var(--ink-soft);
    opacity:0.5;
  }

  .card{
    background: var(--surface);
    border: 3px solid var(--festive-red);
    border-radius: var(--radius);
    box-shadow: var(--shadow), 0 0 0 6px var(--gold), 0 0 0 7px rgba(154,44,24,0.15);
    padding: 44px 40px 40px;
    position: relative;
    overflow: hidden;
  }
  .card::before{
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px dashed rgba(246,167,36,0.55);
    border-radius: calc(var(--radius) - 6px);
    pointer-events: none;
    z-index: 1;
  }

  /* ---------- 過年裝飾：燈籠 ---------- */
  .festive-lantern{
    position: absolute;
    top: 4px;
    width: 42px;
    z-index: 3;
    pointer-events: none;
    filter: drop-shadow(0 6px 10px rgba(154,44,24,0.3));
    animation: lanternSwing 4.5s ease-in-out infinite;
    transform-origin: top center;
  }
  .festive-lantern-left{ left: 12px; }
  .festive-lantern-right{ right: 12px; animation-delay: 0.6s; }
  @keyframes lanternSwing{
    0%, 100%{ transform: rotate(-4deg); }
    50%{ transform: rotate(4deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .festive-lantern{ animation: none; }
  }
  @media (max-width: 520px){
    .festive-lantern{ width: 30px; top: 3px; }
    .festive-lantern-left{ left: 6px; }
    .festive-lantern-right{ right: 6px; }
  }

  /* ---------- 過年裝飾：四角如意雲紋角花 ---------- */
  .festive-corner{
    position: absolute;
    width: 46px;
    height: 46px;
    z-index: 2;
    pointer-events: none;
    opacity: 0.9;
  }
  .corner-tl{ top: 0; left: 0; }
  .corner-tr{ top: 0; right: 0; }
  .corner-bl{ bottom: 0; left: 0; }
  .corner-br{ bottom: 0; right: 0; }
  @media (max-width: 520px){
    .festive-corner{ width: 34px; height: 34px; }
  }

  /* ---------- 過年裝飾：頂端小燈籠串 ---------- */
  .lantern-string{
    position: absolute;
    top: 2px;
    left: 60px;
    right: 60px;
    height: 26px;
    z-index: 2;
    pointer-events: none;
  }
  .lantern-string svg{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .mini-lantern{
    position: absolute;
    top: 8px;
    width: 12px;
    height: 16px;
    background: var(--festive-red);
    border: 1px solid var(--gold);
    border-radius: 4px;
    transform: translateX(-50%);
    animation: miniLanternSway 3.6s ease-in-out infinite;
  }
  .mini-lantern:nth-child(3){ animation-delay: 0.4s; }
  .mini-lantern:nth-child(4){ animation-delay: 0.8s; }
  @keyframes miniLanternSway{
    0%, 100%{ transform: translateX(-50%) rotate(-6deg); }
    50%{ transform: translateX(-50%) rotate(6deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .mini-lantern{ animation: none; }
  }
  @media (max-width: 520px){
    .lantern-string{ left: 42px; right: 42px; }
    .mini-lantern{ width: 9px; height: 12px; top: 6px; }
  }

  @media (max-width: 520px){
    .card{ padding: 32px 22px 30px; }
    body{ padding: 32px 14px 60px; }
  }

  /* ---------- 波浪進度條 ---------- */
  .wave-progress{
    position: relative;
    height: 34px;
    margin-bottom: 30px;
    display:none;
  }
  .wave-progress.active{ display:block; }
  .wave-track{
    position:absolute; inset:0;
    border-radius: 999px;
    background: var(--brand-pale);
    overflow:hidden;
    border: 1px solid var(--line);
  }
  .wave-fill{
    position:absolute; top:0; left:0; bottom:0;
    width: 0%;
    background: linear-gradient(90deg, var(--brand-deep), var(--brand));
    transition: width 0.55s cubic-bezier(.65,0,.35,1);
    border-radius: 999px;
  }
  .wave-label{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:"IBM Plex Mono", "Noto Sans", sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--brand-deep);
    letter-spacing: 0.06em;
    z-index:2;
  }

  /* ---------- INTRO ---------- */
  .screen{ display:none; }
  .screen.active{ display:block; animation: rise 0.5s ease; }
  @keyframes rise{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .mascot{
    width: 108px;
    display:block;
    margin: 0 auto 20px;
    filter: drop-shadow(0 14px 20px rgba(5,56,139,0.28));
  }

  h1.title{
    font-family: "Noto Serif TC", serif;
    font-weight: 900;
    font-size: clamp(30px, 6vw, 38px);
    line-height: 1.35;
    text-align:center;
    margin: 0 0 14px;
    color: var(--ink);
  }

  p.lede{
    text-align:center;
    color: var(--ink-soft);
    font-size: 18px;
    line-height: 1.85;
    max-width: 440px;
    margin: 0 auto 30px;
  }

  .meta-row{
    display:flex;
    justify-content:center;
    gap: 22px;
    font-family:"IBM Plex Mono", "Noto Sans", sans-serif;
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .meta-row span{ display:flex; align-items:center; gap:6px; }
  .meta-dot{ width:5px; height:5px; border-radius:50%; background: var(--brand); }
  .meta-row span:nth-child(1) .meta-dot{ background: var(--orange); }
  .meta-row span:nth-child(2) .meta-dot{ background: var(--teal); }
  .meta-row span:nth-child(3) .meta-dot{ background: var(--gold); }

  .field{
    margin-bottom: 16px;
  }
  .field label{
    display:block;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .field input{
    width:100%;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    font-size: 17px;
    font-family: inherit;
    color: var(--ink);
    background: #FCFDFE;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus{
    outline:none;
    border-color: var(--brand);
    box-shadow: 0 0 0 4px var(--brand-pale);
  }
  .field .hint{
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 6px;
    opacity: 0.8;
  }

  .privacy-note{
    background: var(--brand-pale);
    border: 1px solid #CFE6F5;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--brand-deep);
    margin: 22px 0 26px;
  }

  /* ---------- 語言切換 ---------- */
  .lang-switch{
    display:flex;
    justify-content:center;
    gap: 8px;
    margin: 4px 0 24px;
    flex-wrap: wrap;
  }
  .lang-pill{
    padding: 7px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .lang-pill:hover{ border-color: var(--brand); color: var(--brand-deep); }
  .lang-pill.active{
    background: var(--brand-deep);
    border-color: var(--brand-deep);
    color: #fff;
  }

  button.primary{
    width:100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: var(--brand-deep);
    color: #fff;
    font-family: "Noto Sans TC", sans-serif;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 14px 26px -14px rgba(12,78,124,0.65);
  }
  button.primary:hover{ background: var(--brand); transform: translateY(-1px); }
  button.primary:active{ transform: translateY(0); }
  button.primary:disabled{
    background: #B9C6D1;
    box-shadow:none;
    cursor:not-allowed;
    transform:none;
  }

  .error-msg{
    color: var(--passion);
    font-size: 15px;
    font-weight:600;
    margin-top: -6px;
    margin-bottom: 14px;
    display:none;
  }
  .error-msg.show{ display:block; }

  /* ---------- QUIZ ---------- */
  .q-eyebrow{
    font-family:"IBM Plex Mono", "Noto Sans", sans-serif;
    font-size: 14px;
    color: var(--brand-deep);
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    font-weight: 500;
  }

  h2.q-text{
    font-family:"Noto Serif TC", serif;
    font-weight: 700;
    font-size: clamp(22px, 4.2vw, 26px);
    line-height: 1.55;
    margin: 0 0 26px;
    color: var(--ink);
  }

  .options{
    display:flex;
    flex-direction: column;
    gap: 12px;
  }

  .option{
    display:flex;
    align-items:flex-start;
    gap: 14px;
    padding: 16px 18px;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: #FCFDFE;
    cursor:pointer;
    text-align:left;
    font-family: inherit;
    font-size: 18px;
    line-height: 1.65;
    color: var(--ink);
    transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
  }
  .option:hover{
    border-color: var(--brand);
    background: var(--brand-pale);
    transform: translateX(2px);
  }
  .option:disabled{
    cursor: default;
  }
  .option.selected{
    border-color: var(--brand);
    background: var(--brand-pale);
    box-shadow: 0 0 0 3px var(--brand-pale);
  }
  .option.selected .badge{
    background: var(--brand-deep);
    color: #fff;
  }
  .option .badge{
    flex: 0 0 auto;
    width: 30px; height:30px;
    border-radius: 8px;
    background: var(--brand-pale);
    color: var(--brand-deep);
    display:flex; align-items:center; justify-content:center;
    font-family:"IBM Plex Mono", "Noto Sans", sans-serif;
    font-weight: 700;
    font-size: 15px;
    margin-top: 1px;
    transition: background 0.18s ease, color 0.18s ease;
  }

  /* ---------- CALCULATING（結果揭曉前的過場） ---------- */
  .calc-wrap{
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    padding: 50px 10px 46px;
    text-align:center;
  }
  .calc-mascot{
    width: 72px;
    margin-bottom: 22px;
    animation: bob 1.4s ease-in-out infinite;
  }
  @keyframes bob{
    0%, 100%{ transform: translateY(0); }
    50%{ transform: translateY(-8px); }
  }
  .calc-dots{
    display:flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .calc-dots span{
    width: 8px; height:8px;
    border-radius:50%;
    background: var(--brand);
    opacity: 0.35;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .calc-dots span:nth-child(2){ animation-delay: 0.15s; }
  .calc-dots span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes pulse{
    0%, 100%{ opacity: 0.3; transform: scale(1); }
    50%{ opacity: 1; transform: scale(1.25); }
  }
  .calc-text{
    font-family: "IBM Plex Mono", "Noto Sans", sans-serif;
    font-size: 16px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  /* ---------- 結果頁 揭曉動畫 ---------- */
  .result-head .result-name,
  .result-head .result-tagline{
    opacity: 0;
  }
  .result-head.reveal .result-name{
    animation: nameReveal 0.55s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .result-head.reveal .result-tagline{
    animation: tagReveal 0.5s ease forwards;
    animation-delay: 0.4s;
  }
  @keyframes nameReveal{
    from{ opacity:0; transform: scale(0.88); }
    to{ opacity:1; transform: scale(1); }
  }
  @keyframes tagReveal{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .result-body{
    opacity: 0;
  }
  .result-body.reveal{
    animation: bodyReveal 0.5s ease forwards;
    animation-delay: 0.75s;
  }
  @keyframes bodyReveal{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .quiz-foot{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 26px;
  }
  .link-btn{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size: 15px;
    font-family: inherit;
    cursor:pointer;
    padding: 6px 4px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .link-btn:disabled{ opacity:0.35; cursor:default; text-decoration:none; }

  /* ---------- RESULT ---------- */
  .result-head{
    text-align:center;
    padding-bottom: 26px;
    margin-bottom: 26px;
    border-bottom: 1px dashed var(--line);
  }
  .result-eyebrow{
    font-family:"IBM Plex Mono", "Noto Sans", sans-serif;
    font-size: 14px;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .result-avatar{
    width: 86px;
    height: 86px;
    border-radius: 50%;
    margin: 0 auto 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: "Noto Serif TC", serif;
    font-weight: 900;
    font-size: 34px;
    color: #fff;
    box-shadow: 0 12px 24px -10px rgba(11,42,85,0.45);
    opacity: 0;
  }
  .result-head.reveal .result-avatar{
    animation: avatarPop 0.5s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes avatarPop{
    0%{ opacity:0; transform: scale(0.4); }
    100%{ opacity:1; transform: scale(1); }
  }
  .result-name{
    font-family:"Noto Serif TC", serif;
    font-weight: 900;
    font-size: clamp(34px, 8vw, 46px);
    margin: 0 0 12px;
  }
  .result-tagline{
    display:inline-block;
    font-size: 16px;
    font-weight: 700;
    padding: 7px 16px;
    border-radius: 999px;
  }

  .result-body p{
    font-size: 18px;
    line-height: 1.95;
    color: var(--ink);
    margin: 0 0 18px;
  }
  .result-body p:last-child{ margin-bottom:0; }
  .result-label{
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .result-tags{
    display:flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
  }
  .result-tag{
    padding: 11px 16px;
    border-radius: 12px;
    border: 1.5px solid currentColor;
    font-size: 16px;
    font-weight: 600;
    text-align:center;
  }

  .result-actions{
    margin-top: 32px;
    display:flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .result-actions button{
    flex:1;
    min-width: 140px;
  }
  button.ghost{
    padding: 15px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--ink);
    font-family: inherit;
    font-weight: 600;
    font-size: 18px;
    cursor:pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  button.ghost:hover{ border-color: var(--brand); background: var(--brand-pale); }

  .submit-status{
    text-align:center;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 16px;
    font-family:"IBM Plex Mono", "Noto Sans", sans-serif;
    min-height: 16px;
  }

  .footer-note{
    text-align:center;
    font-size: 13px;
    color: var(--ink-soft);
    opacity: 0.6;
    margin-top: 22px;
    letter-spacing: 0.03em;
  }

  /* ---------- 標題漸層文字（節慶感的低調做法：色彩，不加花俏裝飾） ---------- */
  .title.title-gradient{
    background: linear-gradient(90deg, var(--navy), var(--teal) 45%, var(--gold) 75%, var(--orange));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
  }

  /* ---------- 五彩進度條（取代單色，呼應CIS色票） ---------- */
  .wave-fill{
    background: linear-gradient(90deg, var(--navy), var(--blue) 35%, var(--teal) 65%, var(--gold));
  }

  /* ---------- 五彩紙片（環境飄落層，用於首頁） ---------- */
  .confetti-layer{
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }
  .confetti-piece{
    position: absolute;
    top: -24px;
    border-radius: 2px;
    will-change: transform, opacity;
  }
  @keyframes confettiFall{
    0%{ transform: translateY(0) rotate(0deg); opacity: 0; }
    10%{ opacity: 0.9; }
    100%{ transform: translateY(112vh) rotate(340deg); opacity: 0.75; }
  }

  /* ---------- 結果揭曉爆發層（一次性慶祝動畫） ---------- */
  .confetti-burst-layer{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 60;
    overflow: hidden;
  }
  .confetti-burst-piece{
    position: absolute;
    left: var(--ox, 50%);
    top: var(--oy, 34%);
    border-radius: 2px;
    opacity: 0;
    will-change: transform, opacity;
  }
  .confetti-burst-piece.is-circle{ border-radius: 50%; }
  @keyframes confettiBurst{
    0%{
      transform: translate(-50%,-50%) scale(0.3) rotate(0deg);
      opacity: 1;
      animation-timing-function: cubic-bezier(.12,.62,.28,1); /* 噴發：先快後慢，像對抗重力往上衝 */
    }
    45%{
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.05) rotate(var(--rotMid));
      opacity: 1;
      animation-timing-function: cubic-bezier(.55,0,.85,.35); /* 墜落：先慢後快，模擬重力加速 */
    }
    100%{

      <h1 class="title title-gradient" id="titleText">測出你的核心價值屬性</h1>
      <p class="lede" id="ledeText">
        這是一個約 1–2 分鐘的行為傾向快篩，依《核心價值行為準則》設計，
        透過 7 題情境選擇（5題快速直覺、2題回想真實經驗），對應出你在州巧「熱情、創新、共贏」三種價值中，
        目前最鮮明的行為傾向。
      </p>

let currentLang = "zh-Hant";

function T(){ return TRANSLATIONS[currentLang]; }
function QUESTIONS(){ return T().questions; }
function RESULT_TYPE(key){
  const rt = T().resultTypes[key];
  const varMap = { A: ["--passion","--passion-pale"], B: ["--innovation","--innovation-pale"], C: ["--winwin","--winwin-pale"] };
  return { key, char: rt.char, name: rt.name, tagline: rt.tagline, desc: rt.desc, tags: rt.tags,
    varName: varMap[key][0], pale: varMap[key][1] };
}

function setLanguage(code){

    if(code === currentLang) return;
  }
  currentLang = code;
  applyStaticText();
  // 若使用者已經在題目畫面中，重新渲染當前題目以套用新語言

}

const REDUCE_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const CONFETTI_COLORS = ["var(--navy)","var(--blue)","var(--teal)","var(--mint)","var(--gold)","var(--orange)","var(--festive-red)"];
const BURST_COLOR_MAP = { A: "var(--passion)", B: "var(--innovation)", C: "var(--winwin)" };

function spawnAmbientConfetti(count){
  if(REDUCE_MOTION) return;
  const container = document.getElementById("confettiAmbient");
  if(!container || container.childElementCount > 0) return; // 避免重複生成
  for(let i = 0; i < count; i++){
    const el = document.createElement("div");
    el.className = "confetti-piece";
    const size = 6 + Math.random() * 6;
    el.style.left = Math.random() * 100 + "%";
    el.style.width = size + "px";
    el.style.height = (size * 1.6) + "px";
    el.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    el.style.animationName = "confettiFall";
    el.style.animationTimingFunction = "linear";
    el.style.animationIterationCount = "infinite";
    el.style.animationDuration = (6 + Math.random() * 5) + "s";
    el.style.animationDelay = (Math.random() * 6) + "s";
    container.appendChild(el);
  }
}

function spawnBurstConfetti(resultKey, count){
  if(REDUCE_MOTION) return;
  const container = document.getElementById("confettiBurst");
  if(!container) return;
  container.innerHTML = "";
  const mainColor = BURST_COLOR_MAP[resultKey] || "var(--winwin)";

  // 一枚紙片：從指定原點（ox, oy）往「大致向上、左右擴散」方向噴發，
  // 中段是噴發高點，後段像重力拉回般往下墜落淡出
  function makePiece(ox, oy, spreadCenter, spreadWidth, launchStrength, delay){
    const el = document.createElement("div");
    el.className = "confetti-burst-piece" + (Math.random() < 0.4 ? " is-circle" : "");

    // 角度以「正上方」為中心，左右展開 spreadWidth（弧度）
    const angle = spreadCenter + (Math.random() - 0.5) * spreadWidth;
    const dist = launchStrength * (0.7 + Math.random() * 0.6);
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;

    const dxFall = dx + (Math.random() - 0.5) * 60;
    const dyFall = dy + 130 + Math.random() * 90; // 重力往下拉

    const size = 6 + Math.random() * 9;
    const useColor = Math.random() < 0.55 ? mainColor : CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];

    el.style.setProperty("--ox", ox);
    el.style.setProperty("--oy", oy);
    el.style.setProperty("--dx", dx + "px");
    el.style.setProperty("--dy", dy + "px");
    el.style.setProperty("--dxFall", dxFall + "px");
    el.style.setProperty("--dyFall", dyFall + "px");
    el.style.setProperty("--rotMid", (Math.random() * 480 - 240) + "deg");
    el.style.setProperty("--rotEnd", (Math.random() * 1080 - 540) + "deg");
    el.style.width = size + "px";
    el.style.height = (size * (Math.random() < 0.4 ? 1 : 1.5)) + "px";
    el.style.background = useColor;
    el.style.animation = `confettiBurst ${1.3 + Math.random() * 0.5}s cubic-bezier(.16,.84,.32,1) forwards`;
    el.style.animationDelay = delay + "s";
    container.appendChild(el);
  }

  // 單一原點，從結果卡片中央偏上噴發，往上方大角度扇形擴散後自然墜落
  for(let i = 0; i < count; i++){
    makePiece("50%", "32%", -Math.PI / 2, Math.PI * 1.1, 110 + Math.random() * 100, Math.random() * 0.18);
  }

  setTimeout(() => { container.innerHTML = ""; }, 2400);
}

function renderQuestion(){
  const q = QUESTIONS()[currentQ];
  document.getElementById("qEyebrow").textContent =
    (currentQ + 1) + (q.tag ? " · " + q.tag : "");
  document.getElementById("qText").textContent = q.text;

  const wrap = document.getElementById("qOptions");
  wrap.innerHTML = "";
  const letters = ["A","B","C"];
  q.options.forEach((optText, idx) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerHTML = `<span class="badge">${letters[idx]}</span><span>${optText}</span>`;
    btn.addEventListener("click", () => selectAnswer(letters[idx], btn));
    wrap.appendChild(btn);
  });

  document.getElementById("backBtn").disabled = currentQ === 0;

  const pct = Math.round((currentQ / QUESTIONS().length) * 100);
  document.getElementById("waveFill").style.width = pct + "%";
  document.getElementById("waveLabel").textContent = `${currentQ + 1} / ${QUESTIONS().length}`;
}

function selectAnswer(letter, btnEl){
  answers[currentQ] = letter;

  // 短暫的選中反饋：先讓使用者看到自己選了哪一個，再往下走
  document.querySelectorAll("#qOptions .option").forEach(b => b.disabled = true);
  btnEl.classList.add("selected");

  const pct = Math.round(((currentQ + 1) / QUESTIONS().length) * 100);
  document.getElementById("waveFill").style.width = pct + "%";

  setTimeout(() => {
    if(currentQ < QUESTIONS().length - 1){
      currentQ++;
      renderQuestion();
    } else {
      finishQuiz();
    }
  }, 380);
}

document.getElementById("backBtn").addEventListener("click", () => {

});

/* =========================================================
   8. 計分邏輯
   規則：
   1) 統計 A / B / C 三者在全部7題中的作答次數，次數最高者為結果類型
   2) 若最高分不只一個類型（平手）：
      比較這些平手類型中，在 Q6、Q7（回想情境題，信度較高）
      這兩題裡各自被選中的次數，次數較高者勝出
   3) 若在 Q6、Q7 裡也平手：
      優先採用 Q7 的答案（比 Q6 更後作答、更即時的回想）；
      若 Q7 答案不屬於任一平手類型，改採 Q6 的答案；
      兩者都不屬於平手類型，則回頭比對 Q1-Q5，
      從最後一題（Q5）往前找，取第一個屬於平手類型的答案
   ========================================================= */
function determineType(ans){
  const counts = { A: 0, B: 0, C: 0 };
  ans.forEach(a => counts[a]++);

  const maxCount = Math.max(counts.A, counts.B, counts.C);
  const tied = ["A","B","C"].filter(k => counts[k] === maxCount);

  if(tied.length === 1) return tied[0];

  // Q6、Q7 為索引 5、6（回想情境題，信度較高，優先作為平手依據）
  const recallAnswers = [ans[5], ans[6]];
  const recallCounts = { A: 0, B: 0, C: 0 };
  recallAnswers.forEach(a => { if(tied.includes(a)) recallCounts[a]++; });

  const recallMax = Math.max(...tied.map(k => recallCounts[k]));
  const recallTied = tied.filter(k => recallCounts[k] === recallMax && recallMax > 0);

  if(recallTied.length === 1) return recallTied[0];

  // Q6、Q7 仍分不出來：優先看 Q7，再看 Q6
  if(tied.includes(ans[6])) return ans[6];
  if(tied.includes(ans[5])) return ans[5];

  // 仍未分出：回頭從 Q5 往前比對 Q1-Q5
  for(let i = 4; i >= 0; i--){
    if(tied.includes(ans[i])) return ans[i];
  }
  return tied[0]; // 理論上不會走到這裡
}

function CALC_MESSAGES(){ return T().calcMessages; }

function finishQuiz(){
  const resultKey = determineType(answers);
  lastResultKey = resultKey;
  const result = RESULT_TYPE(resultKey);
  const typeColor = getComputedStyle(document.documentElement).getPropertyValue(result.varName);

  // 先把結果內容準備好（畫面上還不會顯示，等揭曉動畫觸發）
  const avatarEl = document.getElementById("resultAvatar");
  avatarEl.textContent = result.char;
  avatarEl.style.background = typeColor;

  document.getElementById("resultName").textContent = result.name;
  document.getElementById("resultName").style.color = typeColor;

  const tagline = document.getElementById("resultTagline");
  tagline.textContent = result.tagline;
  tagline.style.color = typeColor;
  tagline.style.background = getComputedStyle(document.documentElement).getPropertyValue(result.pale);

  document.getElementById("resultDesc").textContent = result.desc;

  const tagsWrap = document.getElementById("resultTags");
  tagsWrap.innerHTML = "";
  result.tags.forEach(tagText => {
    const el = document.createElement("div");
    el.className = "result-tag";
    el.textContent = tagText;
    el.style.color = typeColor;
    el.style.background = getComputedStyle(document.documentElement).getPropertyValue(result.pale);
    tagsWrap.appendChild(el);
  });

  // 計算中過場：切換訊息文字，製造「正在運算」的感覺
  showScreen("screen-calc");
  const calcTextEl = document.getElementById("calcText");
  let msgIdx = 0;
  calcTextEl.textContent = CALC_MESSAGES()[0];
  const msgTimer = setInterval(() => {
    msgIdx++;
    if(msgIdx < CALC_MESSAGES().length){
      calcTextEl.textContent = CALC_MESSAGES()[msgIdx];
    }
  }, 650);

  // 目前不儲存作答資料，如需重新開啟，把下面這行取消註解即可：
  // submitResult(resultKey);

  setTimeout(() => {
    clearInterval(msgTimer);
    // 重置揭曉動畫（若使用者重測過，移除舊的 class 再重新加，動畫才會重跑）
    const headEl = document.querySelector(".result-head");
    const bodyEl = document.querySelector(".result-body");
    const nameEl = document.getElementById("resultName");
    const taglineEl = document.getElementById("resultTagline");
    const avatarEl = document.getElementById("resultAvatar");
    [headEl, bodyEl, nameEl, taglineEl, avatarEl].forEach(el => {
      el.classList.remove("reveal");
      el.style.opacity = "";
    });
    void headEl.offsetWidth; // 強制重新計算，讓動畫可以重新觸發

    showScreen("screen-result");
    headEl.classList.add("reveal");
    bodyEl.classList.add("reveal");
    spawnBurstConfetti(resultKey, 46);

    // 動畫跑完後把透明度改成固定的行內樣式，
    // 避免 html2canvas 截圖時讀不到動畫算出來的最終狀態（下載圖片會出現內容缺失）
    setTimeout(() => {
      [headEl, bodyEl, nameEl, taglineEl, avatarEl].forEach(el => {
        el.style.opacity = "1";
      });
    }, 1300);
  }, 1900);
}

function submitResult(resultKey){
  const statusEl = document.getElementById("submitStatus");

  const answerData = {
    employeeId: employeeId,
    employeeName: employeeName,
    q1: answers[0],
    q2: answers[1],
    q3: answers[2],
    q4: answers[3],
    q5: answers[4],
    resultType: resultKey,
    resultName: RESULT_TYPE(resultKey).name
  };

  if(USE_GOOGLE_FORM){
    submitViaGoogleForm_(answerData, statusEl);
  } else {
    submitViaAppsScript_(answerData, statusEl);
  }
}

function submitViaAppsScript_(data, statusEl){
  if(!SCRIPT_URL || SCRIPT_URL.indexOf("PASTE_YOUR") === 0){
    statusEl.textContent = "（尚未設定資料儲存網址，本次結果未被記錄）";
    return;
  }

  statusEl.textContent = "資料儲存中…";

  const payload = new URLSearchParams();
  Object.keys(data).forEach(k => payload.append(k, data[k]));

  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: payload.toString()
  }).then(() => {
    statusEl.textContent = "已完成記錄";
  }).catch(() => {
    statusEl.textContent = "資料儲存失敗，請截圖此畫面回報平台管理者";
  });
}

function submitViaGoogleForm_(data, statusEl){
  if(!FORM_ACTION_URL || FORM_ACTION_URL.indexOf("PASTE_YOUR") === 0){
    statusEl.textContent = "（尚未設定 Google 表單網址，本次結果未被記錄）";
    return;
  }

  statusEl.textContent = "資料儲存中…";

  const payload = new URLSearchParams();
  Object.keys(data).forEach(key => {
    const entryId = FORM_ENTRY_IDS[key];
    if(entryId && entryId.indexOf("XXXX") === -1){
      payload.append(entryId, data[key]);
    }
  });

  fetch(FORM_ACTION_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: payload.toString()
  }).then(() => {
    statusEl.textContent = "已完成記錄";
  }).catch(() => {
    statusEl.textContent = "資料儲存失敗，請截圖此畫面回報平台管理者";
  });
}

/* =========================================================
   11. 下載結果圖片
   採用「另外組一張獨立、寫死尺寸與顏色的匯出卡片」的做法，
   不去依賴 html2canvas 對響應式版面／CSS變數的還原（不穩定，會跑版、顏色跑掉）

   桌面：內容多高就多高的卡片（640 CSS px 寬）
   手機：業界慣用的直式分享圖比例 9:16（參考 IG / FB Stories 全螢幕分享圖規格），
        內容置中撐開、字級明顯放大，不是把桌面版縮小
   ========================================================= */

const DOWNLOAD_SCALE = 2; // 固定輸出解析度倍率，不受裝置像素密度影響

// 手機版固定輸出 1080×1920（9:16），這裡先用 CSS px 建構，html2canvas 再乘上 DOWNLOAD_SCALE
const MOBILE_CANVAS_W = 540;
const DESKTOP_CARD_W = 640;

function isMobileViewport(){
  return window.innerWidth <= 520;
}

function buildLanternSVG(gold, red, w, h){
  return `<svg viewBox="0 0 44 78" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="22" y1="0" x2="22" y2="8" stroke="${gold}" stroke-width="2"/>
    <rect x="15" y="6" width="14" height="5" rx="1.5" fill="${gold}"/>
    <ellipse cx="22" cy="34" rx="17" ry="24" fill="${red}"/>
    <ellipse cx="22" cy="34" rx="17" ry="24" fill="none" stroke="${gold}" stroke-width="1.2" opacity="0.55"/>
    <line x1="8" y1="20" x2="36" y2="20" stroke="${gold}" stroke-width="1" opacity="0.5"/>
    <line x1="6" y1="34" x2="38" y2="34" stroke="${gold}" stroke-width="1" opacity="0.5"/>
    <line x1="8" y1="48" x2="36" y2="48" stroke="${gold}" stroke-width="1" opacity="0.5"/>
    <rect x="15" y="56" width="14" height="5" rx="1.5" fill="${gold}"/>
    <line x1="22" y1="61" x2="22" y2="70" stroke="${gold}" stroke-width="2"/>
    <circle cx="22" cy="73" r="3" fill="${gold}"/>
  </svg>`;
}

function buildIngotSVG(gold, size){
  return `<svg viewBox="0 0 60 60" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="30" cy="46" rx="17" ry="9" fill="${gold}"/>
    <ellipse cx="21" cy="34" rx="7.5" ry="7.5" fill="${gold}"/>
    <ellipse cx="39" cy="34" rx="7.5" ry="7.5" fill="${gold}"/>
    <ellipse cx="30" cy="43" rx="9" ry="3.5" fill="#FFE1A0" opacity="0.7"/>
  </svg>`;
}

function getExportColors(result){
  const cs = getComputedStyle(document.documentElement);
  return {
    typeColor: cs.getPropertyValue(result.varName).trim(),
    paleColor: cs.getPropertyValue(result.pale).trim(),
    gold: cs.getPropertyValue("--gold").trim(),
    red: cs.getPropertyValue("--festive-red").trim(),
    ink: cs.getPropertyValue("--ink").trim(),
    inkSoft: cs.getPropertyValue("--ink-soft").trim(),
    line: cs.getPropertyValue("--line").trim()
  };
}

function buildResultInnerHTML(result, t, c, fz){
  return `
    <div style="text-align:center;">
      <div style="font-family:'IBM Plex Mono','Noto Sans',sans-serif; font-size:${fz.eyebrow}px; letter-spacing:0.1em; color:${c.inkSoft}; margin-bottom:${fz.eyebrowGap}px;">${t.resultEyebrow}</div>

      <div style="width:${fz.avatar}px; height:${fz.avatar}px; border-radius:50%; margin:0 auto ${fz.avatarGap}px; background:${c.typeColor}; display:flex; align-items:center; justify-content:center; font-family:'Noto Serif TC',serif; font-weight:900; font-size:${fz.avatarChar}px; color:#ffffff;">${result.char}</div>

      <div style="font-family:'Noto Serif TC',serif; font-weight:900; font-size:${fz.name}px; color:${c.typeColor}; margin-bottom:${fz.nameGap}px; line-height:1.25;">${result.name}</div>

      <div style="display:inline-block; font-size:${fz.tagline}px; font-weight:700; padding:${fz.taglinePadV}px ${fz.taglinePadH}px; border-radius:999px; color:${c.typeColor}; background:${c.paleColor};">${result.tagline}</div>
    </div>

    <div style="border-top:1px dashed ${c.line}; margin:${fz.dividerMargin}px 0;"></div>

    <div style="font-size:${fz.label}px; font-weight:700; letter-spacing:0.08em; color:${c.inkSoft}; margin-bottom:${fz.labelGap}px;">${t.behaviorLabel}</div>
    <p style="font-size:${fz.desc}px; line-height:1.9; color:${c.ink}; margin:0 0 ${fz.descGap}px;">${result.desc}</p>

    <div style="display:flex; flex-direction:column; gap:${fz.tagGap}px;">
      ${result.tags.map(tag => `<div style="padding:${fz.tagPadV}px ${fz.tagPadH}px; border-radius:${fz.tagRadius}px; border:1.5px solid ${c.typeColor}; font-size:${fz.tag}px; font-weight:600; text-align:center; color:${c.typeColor}; background:${c.paleColor};">${tag}</div>`).join("")}
    </div>
  `;
}

// 桌面版：內容多高卡片就多高，寬度固定 640 CSS px
function buildDesktopExportCard(){
  const resultKey = lastResultKey || "A";
  const result = RESULT_TYPE(resultKey);
  const t = T();
  const c = getExportColors(result);

  const fz = {
    eyebrow: 12, eyebrowGap: 14,
    avatar: 86, avatarChar: 34, avatarGap: 16,
    name: 40, nameGap: 12,
    tagline: 16, taglinePadV: 7, taglinePadH: 16,
    dividerMargin: 26,
    label: 14, labelGap: 8,
    desc: 18, descGap: 18,
    tagGap: 10, tagPadV: 11, tagPadH: 16, tagRadius: 12, tag: 16
  };

  const el = document.createElement("div");
  el.style.cssText = `
    position: fixed; left: -9999px; top: 0;
    width: ${DESKTOP_CARD_W}px;
    background: #ffffff;
    border: 3px solid ${c.red};
    border-radius: 20px;
    box-shadow: 0 0 0 6px ${c.gold};
    padding: 40px 36px;
    box-sizing: border-box;
    font-family: "Noto Sans TC", "Noto Sans", "PingFang TC", sans-serif;
  `;

  el.innerHTML = `
    <div style="position:relative;">
      <div style="position:absolute; top:0; left:0;">${buildLanternSVG(c.gold, c.red, 34, 60)}</div>
      <div style="position:absolute; top:0; right:0;">${buildLanternSVG(c.gold, c.red, 34, 60)}</div>
      <div style="padding-top:10px;">
        ${buildResultInnerHTML(result, t, c, fz)}
        <div style="display:flex; justify-content:space-between; margin-top:20px;">
          <div>${buildIngotSVG(c.gold, 40)}</div>
          <div>${buildIngotSVG(c.gold, 40)}</div>
        </div>
      </div>
    </div>
  `;

  document.body.appendChild(el);
  return el;
}

// 手機版：固定 540×960 CSS px（輸出 1080×1920，9:16，比照 IG / FB Stories 全螢幕分享圖規格），
// 內容整體置中撐開版面，字級比桌面版更大，不是桌面版的縮小版
function buildMobileExportCard(){
  const resultKey = lastResultKey || "A";
  const result = RESULT_TYPE(resultKey);
  const t = T();
  const c = getExportColors(result);

  const fz = {
    eyebrow: 20, eyebrowGap: 22,
    avatar: 132, avatarChar: 52, avatarGap: 26,
    name: 58, nameGap: 18,
    tagline: 25, taglinePadV: 12, taglinePadH: 26,
    dividerMargin: 40,
    label: 21, labelGap: 14,
    desc: 28, descGap: 26,
    tagGap: 16, tagPadV: 17, tagPadH: 22, tagRadius: 16, tag: 25
  };

  const innerHTML = `
    ${buildResultInnerHTML(result, t, c, fz)}
    <div style="display:flex; justify-content:space-between; margin-top:32px;">
      <div>${buildIngotSVG(c.gold, 56)}</div>
      <div>${buildIngotSVG(c.gold, 56)}</div>
    </div>
  `;

  // 第一步：先用「高度自由伸展」的方式量出這則語言／結果的實際內容高度
  // （不同語言的文字長度差很多，越南文常常比中文長很多，寫死同一個高度會裁到內容）
  const probe = document.createElement("div");
  probe.style.cssText = `position:fixed; left:-9999px; top:0; width:${MOBILE_CANVAS_W}px; padding:0 44px; box-sizing:border-box; font-family:"Noto Sans TC","Noto Sans","PingFang TC",sans-serif;`;
  probe.innerHTML = innerHTML;
  document.body.appendChild(probe);
  const contentHeight = probe.getBoundingClientRect().height;
  document.body.removeChild(probe);

  const VERTICAL_PADDING = 130; // 上下各約65px的留白
  const PHONE_RATIO_MIN_HEIGHT = Math.round(MOBILE_CANVAS_W * 16 / 9); // 手機常見比例的最小高度下限
  const canvasHeight = Math.max(contentHeight + VERTICAL_PADDING, PHONE_RATIO_MIN_HEIGHT);

  // 第二步：用量出來的高度組出正式畫布，內容置中撐開
  const outer = document.createElement("div");
  outer.style.cssText = `
    position: fixed; left: -9999px; top: 0;
    width: ${MOBILE_CANVAS_W}px;
    height: ${canvasHeight}px;
    background: #ffffff;
    border: 5px solid ${c.red};
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Noto Sans TC", "Noto Sans", "PingFang TC", sans-serif;
  `;

  // 燈籠固定貼在整張畫布的頂端兩角，不隨內容區塊的高度變動而跑位
  const lanternLeft = document.createElement("div");
  lanternLeft.style.cssText = `position:absolute; top:26px; left:22px;`;
  lanternLeft.innerHTML = buildLanternSVG(c.gold, c.red, 52, 92);
  const lanternRight = document.createElement("div");
  lanternRight.style.cssText = `position:absolute; top:26px; right:22px;`;
  lanternRight.innerHTML = buildLanternSVG(c.gold, c.red, 52, 92);

  const inner = document.createElement("div");
  inner.style.cssText = `width: 100%; padding: 0 44px; box-sizing: border-box;`;
  inner.innerHTML = innerHTML;

  outer.appendChild(lanternLeft);
  outer.appendChild(lanternRight);
  outer.appendChild(inner);
  document.body.appendChild(outer);
  return outer;
}

async function downloadResultImage(btn, isMobile){
  const originalLabel = btn.textContent;

  if(typeof html2canvas === "undefined"){
    btn.textContent = T().downloadFailed;
    setTimeout(() => { btn.textContent = originalLabel; }, 2200);
    return;
  }

  btn.disabled = true;
  btn.textContent = T().downloadPreparing;

  const exportEl = isMobile ? buildMobileExportCard() : buildDesktopExportCard();

  try {
    // 等一個 frame，確保剛插入 DOM 的內容已經完成排版
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    const canvas = await html2canvas(exportEl, {
      backgroundColor: "#ffffff",
      scale: DOWNLOAD_SCALE,
      useCORS: true
    });
    const dataUrl = canvas.toDataURL("image/jpeg", 0.92);

    const result = lastResultKey ? RESULT_TYPE(lastResultKey) : null;
    const safeName = (result ? result.name : "duobao-result").replace(/[\\/:*?"<>|]/g, "");
    const suffix = isMobile ? "" : "-desktop";
    const fileName = safeName + suffix + ".jpg";

    const link = document.createElement("a");
    link.href = dataUrl;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    btn.textContent = originalLabel;
  } catch(err){
    btn.textContent = T().downloadFailed;
    setTimeout(() => { btn.textContent = originalLabel; }, 2200);
  } finally {
    document.body.removeChild(exportEl);
    btn.disabled = false;
  }
}

document.getElementById("downloadMobileBtn").addEventListener("click", () => {
  downloadResultImage(document.getElementById("downloadMobileBtn"), true);
});

   12. 重新測驗
   ========================================================= */
document.getElementById("retakeBtn").addEventListener("click", () => {
  currentQ = 0;
  answers.fill(null);
  showScreen("screen-intro");
});
